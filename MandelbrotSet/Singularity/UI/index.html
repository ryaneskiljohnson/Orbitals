<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singularity - Black Hole Compressor</title>
    <style>
        /* Set background to black immediately to prevent white flash */
        html, body { 
            background-color: #000000; 
            margin: 0; 
            padding: 0; 
        }
    </style>
    <link rel="stylesheet" href="../../_Shared/UI/mandelbrot-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container singularity-theme">
        <header class="mandelbrot-header">
            <div class="mandelbrot-logo" title="NNAudio"></div>
            <h1 data-help-title="SINGULARITY"
                data-help-description="Black Hole Compressor - Crushes dynamics to a point of infinite density. Everything beyond the event horizon is pulled toward the singularity.">SINGULARITY</h1>
            <button class="settings-toggle" id="settingsButton" title="Audio/MIDI Settings" style="display: none;">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.4-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.73 1.69.98l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
                </svg>
            </button>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <canvas id="singularityCanvas"></canvas>

            <div class="controls-compressor">
                <!-- Top Row: Main Controls -->
                <div class="control-row-top">
                    <!-- Event Horizon (Threshold) -->
                    <div class="control-group">
                        <label class="control-label">EVENT HORIZON</label>
                        <div class="knob" id="thresholdKnob" data-param="threshold"
                             data-help-title="EVENT HORIZON"
                             data-help-description="The point of no return. Audio above this level is pulled into compression.">
                            <div class="knob-inner">
                                <div class="knob-indicator"></div>
                            </div>
                        </div>
                        <div class="value-display" id="thresholdValue">-20 dB</div>
                    </div>

                    <!-- Gravity (Ratio) -->
                    <div class="control-group">
                        <label class="control-label">GRAVITY</label>
                        <div class="knob" id="ratioKnob" data-param="ratio"
                             data-help-title="GRAVITY"
                             data-help-description="Gravitational pull strength. How much the singularity crushes dynamics.">
                            <div class="knob-inner">
                                <div class="knob-indicator"></div>
                            </div>
                        </div>
                        <div class="value-display" id="ratioValue">4:1</div>
                    </div>
                </div>

                <!-- Middle Row: Time Controls -->
                <div class="control-row-middle">
                    <!-- Collapse (Attack) -->
                    <div class="control-group">
                        <label class="control-label">COLLAPSE</label>
                        <div class="knob" id="attackKnob" data-param="attack"
                             data-help-title="COLLAPSE"
                             data-help-description="How fast matter collapses into the singularity.">
                            <div class="knob-inner">
                                <div class="knob-indicator"></div>
                            </div>
                        </div>
                        <div class="value-display" id="attackValue">10 ms</div>
                    </div>

                    <!-- Hawking Radiation (Release) -->
                    <div class="control-group">
                        <label class="control-label">HAWKING RADIATION</label>
                        <div class="knob" id="releaseKnob" data-param="release"
                             data-help-title="HAWKING RADIATION"
                             data-help-description="Slow escape from the singularity through quantum radiation.">
                            <div class="knob-inner">
                                <div class="knob-indicator"></div>
                            </div>
                        </div>
                        <div class="value-display" id="releaseValue">100 ms</div>
                    </div>
                </div>

                <!-- Bottom Row: Output -->
                <div class="control-row-bottom">
                    <!-- Mass (Makeup Gain) -->
                    <div class="control-group">
                        <label class="control-label">MASS</label>
                        <div class="knob" id="makeupKnob" data-param="makeup"
                             data-help-title="MASS"
                             data-help-description="Total mass and energy of the singularity. Makeup gain after compression.">
                            <div class="knob-inner">
                                <div class="knob-indicator"></div>
                            </div>
                        </div>
                        <div class="value-display" id="makeupValue">+0 dB</div>
                    </div>

                    <!-- Gain Reduction Meter -->
                    <div class="control-group meter-group">
                        <label class="control-label">CRUSHING</label>
                        <div class="gain-reduction-meter">
                            <div class="meter-bar" id="gainReductionBar"></div>
                            <div class="meter-scale">
                                <span>0</span>
                                <span>-6</span>
                                <span>-12</span>
                                <span>-18</span>
                            </div>
                        </div>
                        <div class="value-display" id="grValue">0 dB</div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mandelbrot-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Escapes the singularity. Passes audio through unaffected.">
                <span class="power-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2v10M18 6a9 9 0 1 1-12 0"/>
                    </svg>
                </span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="info-display">
                <div class="meter-container">
                    <label>INPUT</label>
                    <div class="vu-meter">
                        <div class="vu-meter-bar">
                            <div class="vu-meter-fill" id="inputMeterFill"></div>
                            <div class="vu-meter-peak" id="inputMeterPeak"></div>
                        </div>
                        <span class="meter-label" id="inputLevel">-∞ dB</span>
                    </div>
                </div>
                <div class="meter-container">
                    <label>OUTPUT</label>
                    <div class="vu-meter">
                        <div class="vu-meter-bar">
                            <div class="vu-meter-fill" id="outputMeterFill"></div>
                            <div class="vu-meter-peak" id="outputMeterPeak"></div>
                        </div>
                        <span class="meter-label" id="outputLevel">-∞ dB</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/mandelbrot-animations.js"></script>
    <script src="../../_Shared/UI/mandelbrot-particles.js"></script>
    <script src="../../_Shared/UI/mandelbrot-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
