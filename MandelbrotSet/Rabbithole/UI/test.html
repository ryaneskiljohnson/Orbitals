<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; }
        canvas { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="testCanvas"></canvas>
    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1200;
        canvas.height = 750;
        
        function draw() {
            ctx.clearRect(0, 0, 1200, 750);
            
            // Draw debug text
            ctx.fillStyle = 'white';
            ctx.font = '30px monospace';
            ctx.fillText('CANVAS IS RENDERING!', 100, 100);
            ctx.fillText('Time: ' + Date.now(), 100, 150);
            
            // Draw circle
            ctx.beginPath();
            ctx.arc(600, 375, 100, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 5;
            ctx.stroke();
            
            requestAnimationFrame(draw);
        }
        
        draw();
        console.log('Test animation started');
    </script>
</body>
</html>
