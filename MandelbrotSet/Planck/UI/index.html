<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planck - Quantum Scale EQ</title>
    <style>
        /* Set background to black immediately to prevent white flash */
        html, body { 
            background-color: #000000; 
            margin: 0; 
            padding: 0; 
        }
    </style>
    <link rel="stylesheet" href="../../_Shared/UI/mandelbrot-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container planck-theme">
        <header class="mandelbrot-header">
            <div class="mandelbrot-logo"></div>
            <h1 data-help-title="PLANCK"
                data-help-description="Quantum Scale EQ - Manipulates frequency at the Planck scale. Three-band parametric EQ with quantum precision.">PLANCK</h1>
            <button class="settings-toggle" id="settingsButton" title="Audio/MIDI Settings" style="display: none;"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.4-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.73 1.69.98l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/></svg></button><button class="help-toggle" title="Toggle contextual help"></button>
        </header>
        <main class="plugin-main">
            <canvas id="planckCanvas"></canvas>
            <div class="controls-eq">
                <div class="eq-band">
                    <label class="control-label">LOW SCALE</label>
                    <div class="knob" id="lowFreqKnob" data-param="lowfreq"
                         data-help-title="LOW FREQUENCY"
                         data-help-description="Center frequency for low band. Quantum scale adjustment."><div class="knob-inner"><div class="knob-indicator"></div></div></div>
                    <div class="value-display" id="lowFreqValue">100 Hz</div>
                    <div class="knob" id="lowGainKnob" data-param="lowgain"
                         data-help-title="LOW GAIN"
                         data-help-description="Boost or cut low frequencies at Planck precision."><div class="knob-inner"><div class="knob-indicator"></div></div></div>
                    <div class="value-display" id="lowGainValue">0 dB</div>
                </div>
                <div class="eq-band">
                    <label class="control-label">MID SCALE</label>
                    <div class="knob" id="midFreqKnob" data-param="midfreq"
                         data-help-title="MID FREQUENCY"
                         data-help-description="Center frequency for mid band. Most sensitive quantum region."><div class="knob-inner"><div class="knob-indicator"></div></div></div>
                    <div class="value-display" id="midFreqValue">1k Hz</div>
                    <div class="knob" id="midGainKnob" data-param="midgain"
                         data-help-title="MID GAIN"
                         data-help-description="Boost or cut mid frequencies with quantum accuracy."><div class="knob-inner"><div class="knob-indicator"></div></div></div>
                    <div class="value-display" id="midGainValue">0 dB</div>
                </div>
                <div class="eq-band">
                    <label class="control-label">HIGH SCALE</label>
                    <div class="knob" id="highFreqKnob" data-param="highfreq"
                         data-help-title="HIGH FREQUENCY"
                         data-help-description="Center frequency for high band. Ultra-precise quantum control."><div class="knob-inner"><div class="knob-indicator"></div></div></div>
                    <div class="value-display" id="highFreqValue">10k Hz</div>
                    <div class="knob" id="highGainKnob" data-param="highgain"
                         data-help-title="HIGH GAIN"
                         data-help-description="Boost or cut high frequencies at the Planck limit."><div class="knob-inner"><div class="knob-indicator"></div></div></div>
                    <div class="value-display" id="highGainValue">0 dB</div>
                </div>
                <div class="eq-band">
                    <label class="control-label">RESONANCE</label>
                    <div class="knob" id="qKnob" data-param="q"
                         data-help-title="RESONANCE (Q)"
                         data-help-description="Bandwidth of EQ bands. Higher Q creates sharper, more focused curves."><div class="knob-inner"><div class="knob-indicator"></div></div></div>
                    <div class="value-display" id="qValue">1.0</div>
                </div>
            </div>
        </main>
        <footer class="mandelbrot-footer">
            <button class="bypass-toggle active" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Exits quantum realm. Passes audio through unaffected.">
                <span class="power-icon"><svg viewBox="0 0 24 24"><path d="M12 2v10M18 6a9 9 0 1 1-12 0"/></svg></span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="info-display">
                <div class="meter-container">
                    <label>INPUT</label>
                    <div class="vu-meter">
                        <div class="vu-meter-bar">
                            <div class="vu-meter-fill" id="inputMeterFill"></div>
                            <div class="vu-meter-peak" id="inputMeterPeak"></div>
                        </div>
                        <span class="meter-label" id="inputLevel">-∞ dB</span>
                    </div>
                </div>
                <div class="meter-container">
                    <label>OUTPUT</label>
                    <div class="vu-meter">
                        <div class="vu-meter-bar">
                            <div class="vu-meter-fill" id="outputMeterFill"></div>
                            <div class="vu-meter-peak" id="outputMeterPeak"></div>
                        </div>
                        <span class="meter-label" id="outputLevel">-∞ dB</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script src="../../_Shared/UI/mandelbrot-components.js"></script>
    <script src="app.js"></script>
</body>
</html>
