<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  
  <!-- Bypass Icon -->
  <symbol id="icon-bypass" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Preset Icon -->
  <symbol id="icon-preset" viewBox="0 0 24 24">
    <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Info Icon -->
  <symbol id="icon-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Settings Icon -->
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M12 1v6m0 6v10M23 12h-6m-2 0H1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Sun Icon (Perihelion) -->
  <symbol id="icon-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="5" fill="currentColor"/>
    <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Wave Icon (Tidal) -->
  <symbol id="icon-wave" viewBox="0 0 24 24">
    <path d="M2 12c0 0 4-8 8-8s4 8 8 8s4-8 4-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Orbit Icon (Kepler) -->
  <symbol id="icon-orbit" viewBox="0 0 24 24">
    <ellipse cx="12" cy="12" rx="10" ry="6" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="2" fill="currentColor"/>
  </symbol>
  
  <!-- Eclipse Icon -->
  <symbol id="icon-eclipse" viewBox="0 0 24 24">
    <circle cx="10" cy="12" r="8" fill="currentColor"/>
    <circle cx="14" cy="12" r="8" fill="currentColor" opacity="0.3"/>
  </symbol>
  
  <!-- Magnet Icon (Ion) -->
  <symbol id="icon-magnet" viewBox="0 0 24 24">
    <path d="M6 15v-2a6 6 0 1 1 12 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="4" y="15" width="4" height="6" rx="1" fill="currentColor"/>
    <rect x="16" y="15" width="4" height="6" rx="1" fill="currentColor"/>
  </symbol>
  
  <!-- Reverse Icon (Retrograde) -->
  <symbol id="icon-reverse" viewBox="0 0 24 24">
    <path d="M3 12h18M7 16l-4-4 4-4M17 8l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  
  <!-- Trajectory Icon (Apogee) -->
  <symbol id="icon-trajectory" viewBox="0 0 24 24">
    <path d="M2 22 C2 22 8 18 12 10 S20 2 22 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="22" cy="2" r="2" fill="currentColor"/>
  </symbol>
  
  <!-- Balance Icon (Lagrange) -->
  <symbol id="icon-balance" viewBox="0 0 24 24">
    <path d="M12 3v18M8 6l4-3 4 3M8 18l4 3 4-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="5" cy="12" r="2" fill="currentColor"/>
    <circle cx="19" cy="12" r="2" fill="currentColor"/>
  </symbol>
  
  <!-- Play Icon -->
  <symbol id="icon-play" viewBox="0 0 24 24">
    <path d="M5 3l14 9-14 9V3z" fill="currentColor"/>
  </symbol>
  
  <!-- Stop Icon -->
  <symbol id="icon-stop" viewBox="0 0 24 24">
    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
  </symbol>
  
  <!-- Chevron Down -->
  <symbol id="icon-chevron-down" viewBox="0 0 24 24">
    <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  
  <!-- Chevron Up -->
  <symbol id="icon-chevron-up" viewBox="0 0 24 24">
    <polyline points="18 15 12 9 6 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  
  <!-- Close/X -->
  <symbol id="icon-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Check -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  
</svg>
