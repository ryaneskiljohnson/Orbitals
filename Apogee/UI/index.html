<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apogee - Velocity & Energy Booster</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container apogee-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="APOGEE"
                data-help-description="Velocity & Energy Booster - Dynamically boosts note velocities using configurable curves. Raises velocities toward a ceiling with momentum control for expressive energy enhancement.">APOGEE</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <canvas id="trajectoryCanvas"></canvas>

            <div class="controls-layout">
                <!-- Left: Lift Slider -->
                <div class="control-lift">
                    <label class="control-label">LIFT</label>
                    <div class="slider-vertical-tall" id="liftSlider" data-param="lift"
                         data-help-title="LIFT"
                         data-help-description="Controls the amount of velocity boost applied. Higher values raise velocities more dramatically.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="liftValue">50%</div>
                </div>

                <!-- Center: Curve Selector & Ceiling -->
                <div class="control-center">
                    <label class="control-label">CURVE</label>
                    <div class="curve-selector"
                         data-help-title="CURVE"
                         data-help-description="Selects the boost curve shape. LINEAR for even boost, EXP for aggressive, S-CURVE for smooth, LOG for gentle.">
                        <button data-curve="linear" class="active">LINEAR</button>
                        <button data-curve="exp">EXP</button>
                        <button data-curve="s">S-CURVE</button>
                        <button data-curve="log">LOG</button>
                    </div>
                    
                    <label class="control-label">CEILING</label>
                    <div class="slider-horizontal-limiter" id="ceilingSlider" data-param="ceiling"
                         data-help-title="CEILING"
                         data-help-description="Maximum output velocity (1-127). Prevents velocities from exceeding this limit.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="ceilingValue">127</div>
                </div>

                <!-- Right: Momentum Knob -->
                <div class="control-momentum">
                    <label class="control-label">MOMENTUM</label>
                    <div class="knob-large" id="momentumKnob" data-param="momentum"
                         data-help-title="MOMENTUM"
                         data-help-description="Controls how quickly the boost is applied. Higher values create more immediate velocity changes.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="momentumValue">50%</div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">
                <span class="power-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2v10M18 6a9 9 0 1 1-12 0"/>
                    </svg>
                </span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="footer-center">
                <div class="velocity-meter-dual"
                     data-help-title="VELOCITY METERS"
                     data-help-description="Before and After velocity visualization. Shows the input velocity and boosted output velocity in real-time.">
                    <div class="meter-wrapper">
                        <label class="meter-label">BEFORE</label>
                        <div class="meter-before"></div>
                        <div class="meter-value" id="beforeValue">0</div>
                    </div>
                    <div class="meter-wrapper">
                        <label class="meter-label">AFTER</label>
                        <div class="meter-after"></div>
                        <div class="meter-value" id="afterValue">0</div>
                    </div>
                </div>
            </div>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
