<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal - Rhythmic Push & Pull</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container tidal-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1>TIDAL</h1>
            <div class="preset-browser">
                <span>Init Preset</span>
            </div>
        </header>

        <main class="plugin-main">
            <canvas id="tidalCanvas"></canvas>

            <div class="controls-wave">
                <!-- Wave Shape Display (Top) -->
                <div class="control-wave-wide" style="grid-row: 1;">
                    <label class="control-label">WAVE SHAPE</label>
                    <div class="wave-shape-display">
                        <canvas id="waveShapeCanvas"></canvas>
                    </div>
                </div>

                <!-- Center: Amplitude Knob -->
                <div class="control-wave-center">
                    <label class="control-label">AMPLITUDE</label>
                    <div class="amplitude-knob" id="amplitudeKnob" data-param="amplitude">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="amplitudeValue">50%</div>
                </div>

                <!-- Left: Frequency/Rate -->
                <div class="control-wave-section" style="grid-column: 1; grid-row: 2;">
                    <label class="control-label">RATE</label>
                    <div class="tempo-selector">
                        <button data-tempo="1/4" class="active">1/4</button>
                        <button data-tempo="1/8">1/8</button>
                        <button data-tempo="1/16">1/16</button>
                        <button data-tempo="1/32">1/32</button>
                    </div>
                    <div class="value-display" id="rateValue">1/4</div>
                </div>

                <!-- Right: Shape selector -->
                <div class="control-wave-section" style="grid-column: 3; grid-row: 2;">
                    <label class="control-label">SHAPE</label>
                    <div class="tempo-selector">
                        <button data-shape="sine" class="active">SINE</button>
                        <button data-shape="triangle">TRI</button>
                        <button data-shape="saw">SAW</button>
                        <button data-shape="square">SQR</button>
                    </div>
                    <div class="value-display" id="shapeValue">SINE</div>
                </div>

                <!-- Bottom: Phase Slider -->
                <div class="control-wave-wide" style="grid-row: 3;">
                    <label class="control-label">PHASE OFFSET</label>
                    <div class="phase-slider" id="phaseSlider" data-param="phase">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="phaseValue">0°</div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle">BYPASS</button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="wavePhase">Phase: 0°</span>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
