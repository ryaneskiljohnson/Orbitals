<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tidal</title>

<link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css"></head>
<body><div class="plugin-container tidal-theme">
<header class="orbitals-header"><div class="orbitals-logo" title="NNAudio"></div><h1>TIDAL</h1>
<div class="preset-browser"><span>Init</span></div></header>
<main class="plugin-main"><canvas id="tidalCanvas"></canvas>
<div class="controls-tidal">
<div class="control-cycle"><label>CYCLE LENGTH</label>
<div class="tempo-selector">
<button>1/4</button><button>1/2</button><button class="active">1</button>
<button>2</button><button>4</button><button>8</button></div></div>
<div class="control-row-center">
<div class="control-phase"><label>PHASE</label>
<div class="knob-rotation" id="phaseKnob"></div>
<div class="value-display" id="phaseValue">0°</div></div>
<div class="control-strength"><label>TIDE STRENGTH</label>
<div class="knob-large-wave" id="strengthKnob"></div>
<div class="value-display" id="strengthValue">50%</div></div>
<div class="control-flow"><label>FLOW</label>
<div class="slider-toggle" id="flowToggle">
<span>SMOOTH</span><span>STEPPED</span></div></div></div></div></main>
<footer class="orbitals-footer"><button class="bypass-toggle">BYPASS</button>
<div class="timing-deviation-meter"></div></footer></div>



    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script></body></html>
