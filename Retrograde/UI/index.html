<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrograde - MIDI Motion Reversal</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container retrograde-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="RETROGRADE"
                data-help-description="MIDI Motion Reversal - Reverses velocity contours, note timing, or phrase order. Creates mirrored musical patterns with configurable scope and symmetry for creative transformations.">RETROGRADE</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <canvas id="retrogradeCanvas"></canvas>

            <div class="controls-reverse">
                <!-- Mode Selector (Top) -->
                <div class="control-section-wide" style="grid-row: 1;">
                    <div class="mode-selector">
                        <button data-mode="velocity" class="active">VELOCITY</button>
                        <button data-mode="timing">TIMING</button>
                        <button data-mode="phrase">PHRASE</button>
                    </div>
                </div>

                <!-- Center: Depth Knob -->
                <div class="control-section-center">
                    <label class="control-label">DEPTH</label>
                    <div class="depth-knob" id="depthKnob" data-param="depth">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="depthValue">50%</div>
                </div>

                <!-- Bottom: Time Window Slider -->
                <div class="control-section-wide" style="grid-row: 3;">
                    <label class="control-label">TIME WINDOW</label>
                    <div class="time-window-slider" id="timeWindowSlider" data-param="timeWindow">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="timeWindowValue">500ms</div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">BYPASS</button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="reversedCount">Reversed: 0</span>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
