<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrograde - MIDI Motion Reversal</title>
    
    <link rel="stylesheet" href="orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- JUCE native bridge: WKWebView + WebView2 (matches CymaSynth) -->
    <script>
    (function() {
        function sendToHost(msg) {
            try {
                var envelope = (msg && msg.eventId !== undefined) ? msg : { eventId: 'message', payload: msg };
                var payload = (typeof envelope === 'string') ? envelope : JSON.stringify(envelope);
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.__JUCE__) {
                    window.webkit.messageHandlers.__JUCE__.postMessage(payload);
                    return true;
                }
                if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
                    window.chrome.webview.postMessage(payload);
                    return true;
                }
                return false;
            } catch (e) { return false; }
        }
        window.postMessageToJUCE = function(data) { sendToHost(data); };
        window.__JUCE__ = window.__JUCE__ || {
            postMessage: sendToHost,
            backend: {
                emitEvent: function(name, data) {
                    if (name === 'message') return sendToHost(data);
                    return sendToHost({ event: name, data: data });
                }
            }
        };
    })();
    </script>

    <div class="plugin-container retrograde-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="RETROGRADE"
                data-help-description="MIDI Motion Reversal - Reverses velocity contours, note timing, or phrase order. Creates mirrored musical patterns with configurable scope and symmetry for creative transformations.">RETROGRADE</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <canvas id="retrogradeCanvas"></canvas>

            <div class="controls-reverse">
                <!-- Mode Selector (Top) -->
                <div class="control-section-wide" style="grid-row: 1;">
                    <div class="mode-selector"
                         data-help-title="REVERSE MODE"
                         data-help-description="Selects what to reverse - VELOCITY (velocity contours), TIMING (note timing), or PHRASE (note order).">
                        <button data-mode="velocity" class="active">VELOCITY</button>
                        <button data-mode="timing">TIMING</button>
                        <button data-mode="phrase">PHRASE</button>
                    </div>
                </div>

                <!-- Left: Scope Knob -->
                <div class="control-section" style="grid-column: 1; grid-row: 2;">
                    <label class="control-label">SCOPE</label>
                    <div class="scope-knob" id="scopeKnob" data-param="scope"
                         data-help-title="SCOPE"
                         data-help-description="Number of notes or bars to reverse (1-4). Larger scope reverses longer phrases.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display" id="scopeValue">1</div>
                </div>

                <!-- Right: Echo Knob -->
                <div class="control-section" style="grid-column: 3; grid-row: 2;">
                    <label class="control-label">ECHO</label>
                    <div class="echo-knob" id="echoKnob" data-param="echo"
                         data-help-title="ECHO"
                         data-help-description="Creates mirrored copies of reversed notes (0-8 echoes). Adds rhythmic complexity.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display" id="echoValue">0</div>
                </div>

                <!-- Bottom: Symmetry Slider -->
                <div class="control-section-wide" style="grid-row: 4;">
                    <label class="control-label">SYMMETRY</label>
                    <div class="symmetry-slider" id="symmetrySlider" data-param="symmetry"
                         data-help-title="SYMMETRY"
                         data-help-description="Rotation angle of the mirror axis (0-360°). Changes the reflection plane for reversal.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="symmetryValue">180°</div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">
                <span class="power-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2v10M18 6a9 9 0 1 1-12 0"/>
                    </svg>
                </span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="reversedCount">Reversed: 0</span>
            </div>
        </footer>
    </div>

    <script src="orbitals-animations.js"></script>
    <script src="orbitals-particles.js"></script>
    <script src="orbitals-components.js"></script>
    
    <script src="app.js"></script>
    <script src="orbitals-juce-bridge.js"></script>
</body>
</html>
