<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse - Velocity Masking</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container eclipse-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1>ECLIPSE</h1>
            <div class="preset-browser">
                <span>Init Preset</span>
            </div>
        </header>

        <main class="plugin-main">
            <canvas id="eclipseCanvas"></canvas>

            <div class="controls-eclipse">
                <!-- Shadow Zone Range (Top) -->
                <div class="control-eclipse-wide" style="grid-row: 1;">
                    <label class="control-label">SHADOW ZONE (Velocity Range)</label>
                    <div class="shadow-zone-slider" id="shadowZoneSlider" data-param="shadowZone"
                         data-help-title="FADE ZONE"
                         data-help-description="Range around threshold where notes gradually fade in/out. Creates smooth transitions between hidden and revealed notes.">
                        <div class="zone-track"></div>
                        <div class="zone-range"></div>
                        <div class="zone-handle zone-handle-min"></div>
                        <div class="zone-handle zone-handle-max"></div>
                    </div>
                    <div class="value-display" id="shadowZoneValue">40 - 80</div>
                </div>

                <!-- Left: Umbra Control -->
                <div class="control-eclipse-section" style="grid-column: 1; grid-row: 2;">
                    <label class="control-label">UMBRA<br/>(Full Shadow)</label>
                    <div class="umbra-control" id="umbraControl" data-param="umbra"
                         data-help-title="UMBRA (Full Shadow)"
                         data-help-description="Attenuation level for fully masked notes. 100% completely silences them, lower values allow ghost notes through.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display" id="umbraValue">100%</div>
                </div>

                <!-- Center: Totality Knob -->
                <div class="control-eclipse-center">
                    <label class="control-label">TOTALITY</label>
                    <div class="totality-knob" id="totalityKnob" data-param="totality"
                         data-help-title="THRESHOLD"
                         data-help-description="Velocity level where the eclipse occurs (0-127). Notes below are hidden, above are revealed.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="totalityValue">50%</div>
                </div>

                <!-- Right: Penumbra Control -->
                <div class="control-eclipse-section" style="grid-column: 3; grid-row: 2;">
                    <label class="control-label">PENUMBRA<br/>(Partial Shadow)</label>
                    <div class="penumbra-control" id="penumbraControl" data-param="penumbra"
                         data-help-title="PENUMBRA (Partial Shadow)"
                         data-help-description="Attenuation level for partially masked notes in the fade zone. Creates smooth transitions between hidden and revealed.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display" id="penumbraValue">50%</div>
                </div>

                <!-- Mode Toggle (Bottom) -->
                <div class="control-eclipse-wide" style="grid-row: 3;">
                    <div class="eclipse-mode-toggle"
                         data-help-title="INVERT"
                         data-help-description="Toggle between REVEAL (show notes above threshold) and HIDE (hide notes above threshold) modes.">
                        <button data-mode="reveal" class="active">REVEAL</button>
                        <button data-mode="hide">HIDE</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">BYPASS</button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="maskedNotes">Masked: 0</span>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
