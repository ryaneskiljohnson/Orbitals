<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal - Authentication Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 1200px;
            height: 750px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-container {
            text-align: center;
            padding: 40px;
        }
        
        .auth-logo {
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            background-image: url('data:image/png;base64,PLACEHOLDER_LOGO');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        .auth-title {
            font-size: 32px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00d4ff;
        }
        
        .auth-message {
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            color: #e8e8f0;
        }
        
        .auth-status {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
<!--
  @fileoverview Inline fragment: paste immediately after <body> in plugin index.html (before other scripts).
  @module Orbitals/_Shared/UI
  @note Matches Cymasynth / JUCE native integration (WKWebView + WebView2).
-->
<script>
(function() {
    function sendToHost(msg) {
        try {
            var envelope = (msg && msg.eventId !== undefined) ? msg : { eventId: 'message', payload: msg };
            var payload = (typeof envelope === 'string') ? envelope : JSON.stringify(envelope);
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.__JUCE__) {
                window.webkit.messageHandlers.__JUCE__.postMessage(payload);
                return true;
            }
            if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
                window.chrome.webview.postMessage(payload);
                return true;
            }
            return false;
        } catch (e) { return false; }
    }
    window.postMessageToJUCE = function(data) { sendToHost(data); };
    window.__JUCE__ = window.__JUCE__ || {
        postMessage: sendToHost,
        backend: {
            emitEvent: function(name, data) {
                if (name === 'message') return sendToHost(data);
                return sendToHost({ event: name, data: data });
            }
        }
    };
})();
</script>
    <div class="auth-container">
        <div class="auth-logo"></div>
        <h1 class="auth-title">SINGULARITY</h1>
        <p class="auth-message">
            Your plugin's authentication needs to be refreshed.<br>
            Please launch the NNAudio Access app to continue.
        </p>
        <p class="auth-status">Checking license...</p>
    </div>
    
    <script>
        // Periodically check if auth status changes
        setInterval(function() {
            // Send message to C++ to check auth status
            if (window.webkit && window.webkit.messageHandlers) {
                window.webkit.messageHandlers.__JUCE__.postMessage(JSON.stringify({
                    type: 'checkAuth'
                }));
            }
        }, 5000);
    </script>
</body>
</html>
