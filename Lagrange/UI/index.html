<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagrange - Timing Stabilizer</title>
    
    <link rel="stylesheet" href="orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- JUCE native bridge: WKWebView + WebView2 (matches CymaSynth) -->
    <script>
    (function() {
        function sendToHost(msg) {
            try {
                var envelope = (msg && msg.eventId !== undefined) ? msg : { eventId: 'message', payload: msg };
                var payload = (typeof envelope === 'string') ? envelope : JSON.stringify(envelope);
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.__JUCE__) {
                    window.webkit.messageHandlers.__JUCE__.postMessage(payload);
                    return true;
                }
                if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
                    window.chrome.webview.postMessage(payload);
                    return true;
                }
                return false;
            } catch (e) { return false; }
        }
        window.postMessageToJUCE = function(data) { sendToHost(data); };
        window.__JUCE__ = window.__JUCE__ || {
            postMessage: sendToHost,
            backend: {
                emitEvent: function(name, data) {
                    if (name === 'message') return sendToHost(data);
                    return sendToHost({ event: name, data: data });
                }
            }
        };
    })();
    </script>

    <div class="plugin-container lagrange-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="LAGRANGE"
                data-help-description="Timing Stabilizer - Reduces timing drift without quantization. Uses gravitational balance between grid timing and human feel to create stable, natural-sounding rhythms.">LAGRANGE</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <!-- Left: All Controls -->
            <div class="controls-panel">
                <!-- Stability and Mass Sliders Side by Side -->
                <div class="control-section-sliders">
                    <div class="control-section">
                        <label class="control-label">STABILITY</label>
                        <div class="slider-vertical" id="stabilitySlider" data-param="stability"
                             data-help-title="STABILITY"
                             data-help-description="Controls how strongly timing is stabilized. Higher values reduce timing drift without quantization.">
                            <div class="slider-track"></div>
                            <div class="slider-handle"></div>
                        </div>
                        <div class="value-display" id="stabilityValue">50%</div>
                    </div>

                    <div class="control-section">
                        <label class="control-label">MASS</label>
                        <div class="slider-vertical" id="massSlider" data-param="mass"
                             data-help-title="MASS"
                             data-help-description="Affects the gravitational balance between grid and human feel. Higher mass increases pull toward the grid.">
                            <div class="slider-track"></div>
                            <div class="slider-handle"></div>
                        </div>
                        <div class="value-display" id="massValue">50%</div>
                    </div>
                </div>

                <!-- Drift Range Slider -->
                <div class="control-section">
                    <label class="control-label">DRIFT RANGE</label>
                    <div class="range-slider" id="driftSlider" data-param="drift"
                         data-help-title="DRIFT RANGE"
                         data-help-description="Sets the allowed timing deviation range in milliseconds. Notes stay within this window.">
                        <div class="range-slider-track"></div>
                        <div class="range-slider-range"></div>
                        <div class="range-slider-handle range-handle-min"></div>
                        <div class="range-slider-handle range-handle-max"></div>
                    </div>
                    <div class="value-display" id="driftValue">±25ms</div>
                </div>

                <!-- Micro Chaos XY Pad -->
                <div class="control-section">
                    <label class="control-label">MICRO CHAOS</label>
                    <div class="xy-pad" id="chaosPad" data-param="microChaos"
                         data-help-title="MICRO CHAOS"
                         data-help-description="X/Y pad for subtle randomization. X controls timing variance, Y controls velocity variance.">
                        <div class="xy-handle"></div>
                    </div>
                    <div class="value-display" id="chaosValue">X:50 Y:50</div>
                </div>
            </div>

            <!-- Right: Animation Canvas -->
            <div class="animation-panel">
                <canvas id="lagrangeCanvas"></canvas>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">
                <span class="power-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2v10M18 6a9 9 0 1 1-12 0"/>
                    </svg>
                </span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="timing-meter" id="timingMeter"
                 data-help-title="TIMING STABILITY METER"
                 data-help-description="Visualizes the current timing stability. Green indicates stable timing, red indicates drift from the grid.">
                <div class="timing-indicator"></div>
            </div>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
            </div>
        </footer>
    </div>

    <script src="orbitals-animations.js"></script>
    <script src="orbitals-particles.js"></script>
    <script src="orbitals-components.js"></script>
    
    <script src="app.js"></script>
    <script src="orbitals-juce-bridge.js"></script>
</body>
</html>
