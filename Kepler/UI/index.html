<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler - MIDI Orbit Generator</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container kepler-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1>KEPLER</h1>
            <div class="preset-browser">
                <span>Init Preset</span>
            </div>
        </header>

        <main class="plugin-main">
            <canvas id="keplerCanvas"></canvas>

            <div class="controls-orbital">
                <!-- Orbit Visualizer (Top Left) -->
                <div class="control-orbital-section" style="grid-column: 1; grid-row: 1;">
                    <label class="control-label">ORBIT PREVIEW</label>
                    <div class="orbit-visualizer">
                        <canvas id="orbitVisualizerCanvas"></canvas>
                    </div>
                </div>

                <!-- Period Slider (Top Right) -->
                <div class="control-orbital-section" style="grid-column: 3; grid-row: 1;">
                    <label class="control-label">ORBITAL PERIOD</label>
                    <div class="period-selector"
                         data-help-title="ORBITAL PERIOD"
                         data-help-description="Tempo-synced orbit duration. Determines how long it takes for notes to complete one full orbit.">
                        <button data-period="1/8" >1/8</button>
                        <button data-period="1/4">1/4</button>
                        <button data-period="1/2" class="active">1/2</button>
                        <button data-period="1">1 BAR</button>
                        <button data-period="2">2 BAR</button>
                    </div>
                    <div class="value-display" id="periodValue">1/2</div>
                </div>

                <!-- Left: Semi-Major Axis Slider -->
                <div class="control-orbital-section" style="grid-column: 1; grid-row: 2;">
                    <label class="control-label">SEMI-MAJOR<br/>AXIS</label>
                    <div class="semi-major-slider" id="semiMajorSlider" data-param="semiMajor">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="semiMajorValue">64</div>
                </div>

                <!-- Center: Eccentricity Knob -->
                <div class="control-orbital-center">
                    <label class="control-label">ECCENTRICITY</label>
                    <div class="eccentricity-knob" id="eccentricityKnob" data-param="eccentricity">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="eccentricityValue">0.50</div>
                </div>

                <!-- Right: Velocity Spread -->
                <div class="control-orbital-section" style="grid-column: 3; grid-row: 2;">
                    <label class="control-label">VELOCITY<br/>SPREAD</label>
                    <div class="spread-slider" id="spreadSlider" data-param="spread">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="spreadValue">30</div>
                </div>

                <!-- Bottom: Direction Control -->
                <div class="control-orbital-wide" style="grid-row: 3;">
                    <label class="control-label">ORBIT DIRECTION</label>
                    <div class="direction-selector">
                        <button data-dir="cw" class="active">CLOCKWISE</button>
                        <button data-dir="ccw">COUNTER-CW</button>
                        <button data-dir="alt">ALTERNATING</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle">BYPASS</button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="orbitPhase">Phase: 0°</span>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
