<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler - MIDI Orbit Generator</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container kepler-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="KEPLER"
                data-help-description="MIDI Orbit Generator - Transforms note timing using elliptical orbital mechanics. Notes follow multiple orbital paths with configurable eccentricity, period, and direction for complex rhythmic patterns.">KEPLER</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <canvas id="keplerCanvas"></canvas>

            <div class="controls-orbital">
                <!-- Right side: All controls stacked in one column -->
                <div class="controls-right">
                    <!-- Row 1: Orbit Direction -->
                    <div class="control-orbital-section">
                        <label class="control-label">ORBIT DIRECTION</label>
                        <div class="direction-selector"
                             data-help-title="ORBIT DIRECTION"
                             data-help-description="Clockwise, counter-clockwise, or alternating orbital motion. Changes the rhythmic transformation direction.">
                            <button data-dir="cw" class="active">CLOCKWISE</button>
                            <button data-dir="ccw">COUNTER-CW</button>
                            <button data-dir="alt">ALTERNATING</button>
                        </div>
                    </div>

                    <!-- Row 2: Orbital Period -->
                    <div class="control-orbital-section">
                        <label class="control-label">ORBITAL PERIOD</label>
                        <div class="period-selector"
                             data-help-title="ORBITAL PERIOD"
                             data-help-description="Tempo-synced orbit duration. Determines how long it takes for notes to complete one full orbit.">
                            <button data-period="1/8" >1/8</button>
                            <button data-period="1/4">1/4</button>
                            <button data-period="1/2" class="active">1/2</button>
                            <button data-period="1">1 BAR</button>
                            <button data-period="2">2 BAR</button>
                        </div>
                    </div>

                    <!-- Row 3: Eccentricity (smaller) -->
                    <div class="control-orbital-section">
                        <label class="control-label">ECCENTRICITY</label>
                        <div class="eccentricity-knob" id="eccentricityKnob" data-param="eccentricity"
                             data-help-title="ECCENTRICITY"
                             data-help-description="Shape of the orbits (0-0.95). Higher values create more elliptical, less circular orbits with varying note timing.">
                            <div class="knob-inner">
                                <div class="knob-indicator"></div>
                            </div>
                        </div>
                        <div class="value-display" id="eccentricityValue">0.50</div>
                    </div>

                    <!-- Row 4: Both sliders side by side (smaller) -->
                    <div class="control-sliders-group">
                        <div class="control-orbital-section">
                            <label class="control-label">SEMI-MAJOR<br/>AXIS</label>
                            <div class="semi-major-slider" id="semiMajorSlider" data-param="semiMajor"
                                 data-help-title="ORBIT COUNT"
                                 data-help-description="Number of simultaneous orbital paths (1-8). More orbits create complex rhythmic patterns.">
                                <div class="slider-track"></div>
                                <div class="slider-handle"></div>
                            </div>
                            <div class="value-display" id="semiMajorValue">64</div>
                        </div>
                        <div class="control-orbital-section">
                            <label class="control-label">VELOCITY<br/>SPREAD</label>
                            <div class="spread-slider" id="spreadSlider" data-param="spread"
                                 data-help-title="ROTATION SPEED"
                                 data-help-description="How fast notes move through their orbits. Affects rhythmic timing transformation speed.">
                                <div class="slider-track"></div>
                                <div class="slider-handle"></div>
                            </div>
                            <div class="value-display" id="spreadValue">30</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">
                <span class="power-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2v10M18 6a9 9 0 1 1-12 0"/>
                    </svg>
                </span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="orbitPhase">Phase: 0°</span>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
