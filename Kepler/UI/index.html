<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Kepler</title>

<link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css"></head>
<body><div class="plugin-container kepler-theme">
<header class="orbitals-header"><div class="orbitals-logo" title="NNAudio"></div><h1>KEPLER</h1>
<div class="preset-browser"><span>Init</span></div></header>
<main class="plugin-main"><canvas id="keplerCanvas"></canvas>
<div class="controls-kepler">
<div class="control-top-row">
<div class="control-orbit-count"><label>ORBIT COUNT</label>
<div class="knob-stepped" id="orbitCountKnob"></div>
<div class="value-display" id="orbitCountValue">4</div></div>
<div class="control-rotation"><label>ROTATION SPEED</label>
<div class="knob-tempo" id="rotationKnob"></div>
<div class="value-display" id="rotationValue">1 Bar</div></div></div>
<div class="control-eccentricity"><label>ECCENTRICITY</label>
<div class="slider-horizontal-morph" id="eccentricitySlider"></div>
<div class="value-display" id="eccentricityValue">0.5</div></div>
<div class="control-stability"><label>STABILITY</label>
<div class="xy-pad-orbit" id="stabilityPad"></div>
<div class="value-display" id="stabilityValue">X:50 Y:50</div></div></div></main>
<footer class="orbitals-footer"><button class="bypass-toggle">BYPASS</button>
<div class="orbit-phase-display">Phase: 0°</div></footer></div>



    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script></body></html>
