<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perihelion - Velocity Sculptor</title>
    
    <link rel="stylesheet" href="orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- JUCE native bridge: WKWebView + WebView2 (matches CymaSynth) -->
    <script>
    (function() {
        function sendToHost(msg) {
            try {
                var envelope = (msg && msg.eventId !== undefined) ? msg : { eventId: 'message', payload: msg };
                var payload = (typeof envelope === 'string') ? envelope : JSON.stringify(envelope);
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.__JUCE__) {
                    window.webkit.messageHandlers.__JUCE__.postMessage(payload);
                    return true;
                }
                if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
                    window.chrome.webview.postMessage(payload);
                    return true;
                }
                return false;
            } catch (e) { return false; }
        }
        window.postMessageToJUCE = function(data) { sendToHost(data); };
        window.__JUCE__ = window.__JUCE__ || {
            postMessage: sendToHost,
            backend: {
                emitEvent: function(name, data) {
                    if (name === 'message') return sendToHost(data);
                    return sendToHost({ event: name, data: data });
                }
            }
        };
    })();
    </script>

    <div class="plugin-container perihelion-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="PERIHELION"
                data-help-description="Velocity Sculptor - Shapes note velocities using orbital mechanics. Notes are pulled toward a target velocity (solar point) with configurable gravity and orbital eccentricity, creating natural velocity curves based on Kepler's laws.">PERIHELION</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <!-- Particle Animation Canvas -->
            <canvas id="solarCanvas"></canvas>
            
            <div class="controls-layout">
                <!-- Left: Orbit Slider -->
                <div class="control-orbit">
                    <label class="control-label">ORBIT</label>
                    <div class="slider-vertical-tall" id="orbitSlider" data-param="orbit"
                         data-help-title="ORBIT"
                         data-help-description="Controls orbital eccentricity. Low values create circular orbits, high values create highly elliptical paths with varying velocity.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="orbitValue">50%</div>
                </div>

                <!-- Center: Gravity Knob -->
                <div class="control-center">
                    <label class="control-label">GRAVITY</label>
                    <div class="knob-large" id="gravityKnob" data-param="gravity"
                         data-help-title="GRAVITY"
                         data-help-description="Controls how tightly notes are pulled toward the solar point. Higher values create tighter orbits and more intense velocity shaping.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="gravityValue">50%</div>
                </div>

                <!-- Right: Solar Point Slider -->
                <div class="control-solar">
                    <label class="control-label">SOLAR POINT</label>
                    <div class="slider-vertical-tall" id="solarPointSlider" data-param="solarPoint"
                         data-help-title="SOLAR POINT"
                         data-help-description="Target velocity value (1-127) that notes are pulled toward. Acts as the gravitational center for velocity shaping.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="solarPointValue">64</div>
                </div>
            </div>

            <!-- Bottom: Bias Slider -->
            <div class="control-bias">
                <label class="control-label">INNER / OUTER BIAS</label>
                <div class="slider-horizontal" id="biasSlider" data-param="bias"
                     data-help-title="INNER / OUTER BIAS"
                     data-help-description="Rotates the orbital plane. Negative values favor notes below the solar point (inner orbit), positive values favor notes above (outer orbit).">
                    <div class="slider-track"></div>
                    <div class="slider-handle"></div>
                </div>
                <div class="value-display" id="biasValue">0</div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">
                <span class="power-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2v10M18 6a9 9 0 1 1-12 0"/>
                    </svg>
                </span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
            </div>
        </footer>
    </div>

    <script src="orbitals-animations.js"></script>
    <script src="orbitals-particles.js"></script>
    <script src="orbitals-components.js"></script>
    
    <script src="app.js"></script>
    <script src="orbitals-juce-bridge.js"></script>
</body>
</html>
