<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perihelion - Velocity Sculptor</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container perihelion-theme">
        <!-- Header -->
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="PERIHELION"
                data-help-description="Velocity Sculptor - Shapes note velocities using orbital mechanics. Notes are pulled toward a target velocity (solar point) with configurable gravity and orbital eccentricity, creating natural velocity curves based on Kepler's laws.">PERIHELION</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <!-- Main Content -->
        <main class="plugin-main">
            <!-- Background Canvas for Solar Animation -->
            <canvas id="solarCanvas"></canvas>

            <!-- Controls Area -->
            <div class="controls-area">
                <!-- Orbit Arc (Top) -->
                <div class="control-orbit-arc">
                    <label class="control-label">ORBIT</label>
                    <div class="arc-slider" id="orbitControl" data-param="orbit"
                         data-help-title="ORBIT"
                         data-help-description="Controls orbital eccentricity. Low values create circular orbits, high values create highly elliptical paths with varying velocity.">
                        <div class="arc-fill"></div>
                    </div>
                    <div class="value-display" id="orbitValue">50%</div>
                </div>

                <!-- Center: Gravity Knob -->
                <div class="control-center-section">
                    <label class="control-label">GRAVITY</label>
                    <div class="large-knob" id="gravityKnob" data-param="gravity"
                         data-help-title="GRAVITY"
                         data-help-description="Controls how tightly notes are pulled toward the solar point. Higher values create tighter orbits and more intense velocity shaping.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                            <div class="knob-rings"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="gravityValue">50%</div>
                </div>

                <!-- Right: Solar Point Slider -->
                <div class="control-vertical-section">
                    <label class="control-label">SOLAR POINT</label>
                    <div class="slider-vertical-tall solar-slider" id="solarPointSlider" data-param="solarPoint"
                         data-help-title="SOLAR POINT"
                         data-help-description="Target velocity value (1-127) that notes are pulled toward. Acts as the gravitational center for velocity shaping.">
                        <div class="slider-track">
                            <div class="velocity-heatmap"></div>
                        </div>
                        <div class="slider-handle">
                            <div class="sun-icon">☀</div>
                        </div>
                    </div>
                    <div class="value-display" id="solarPointValue">64</div>
                </div>

                <!-- Bottom: Inner/Outer Bias -->
                <div class="control-bias-section">
                    <label class="control-label">INNER / OUTER BIAS</label>
                    <div class="dual-slider" id="biasSlider" data-param="bias"
                         data-help-title="INNER / OUTER BIAS"
                         data-help-description="Rotates the orbital plane. Negative values favor notes below the solar point (inner orbit), positive values favor notes above (outer orbit).">
                        <div class="bias-track">
                            <div class="bias-gradient"></div>
                        </div>
                        <div class="bias-handle"></div>
                        <div class="bias-labels">
                            <span class="label-inner">INNER</span>
                            <span class="label-center">CENTER</span>
                            <span class="label-outer">OUTER</span>
                        </div>
                    </div>
                    <div class="value-display" id="biasValue">0</div>
                </div>
            </div>

            <!-- Velocity Meters (Left Side) -->
            <div class="velocity-meters"
                 data-help-title="VELOCITY METERS"
                 data-help-description="Real-time visualization of input and output velocity levels. Shows how Perihelion shapes incoming note velocities.">
                <div class="meter-column">
                    <label class="meter-label">INPUT</label>
                    <div class="velocity-meter" id="inputMeter">
                        <div class="meter-fill"></div>
                    </div>
                </div>
                <div class="meter-column">
                    <label class="meter-label">OUTPUT</label>
                    <div class="velocity-meter" id="outputMeter">
                        <div class="meter-fill"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">BYPASS</button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="cpuLoad">CPU: 0%</span>
            </div>
        </footer>
    </div>

    <!-- Load shared libraries -->
    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
