<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ion - Harmonic Constraint Engine</title>
    
    <link rel="stylesheet" href="orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- JUCE native bridge: WKWebView + WebView2 (matches CymaSynth) -->
    <script>
    (function() {
        function sendToHost(msg) {
            try {
                var envelope = (msg && msg.eventId !== undefined) ? msg : { eventId: 'message', payload: msg };
                var payload = (typeof envelope === 'string') ? envelope : JSON.stringify(envelope);
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.__JUCE__) {
                    window.webkit.messageHandlers.__JUCE__.postMessage(payload);
                    return true;
                }
                if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
                    window.chrome.webview.postMessage(payload);
                    return true;
                }
                return false;
            } catch (e) { return false; }
        }
        window.postMessageToJUCE = function(data) { sendToHost(data); };
        window.__JUCE__ = window.__JUCE__ || {
            postMessage: sendToHost,
            backend: {
                emitEvent: function(name, data) {
                    if (name === 'message') return sendToHost(data);
                    return sendToHost({ event: name, data: data });
                }
            }
        };
    })();
    </script>

    <div class="plugin-container ion-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1 data-help-title="ION"
                data-help-description="Harmonic Constraint Engine - Pulls notes toward a selected key and scale using magnetic attraction. Configurable field width and tension create natural harmonic correction.">ION</h1>
            <button class="help-toggle" title="Toggle contextual help"></button>
        </header>

        <main class="plugin-main">
            <!-- Animation Canvas - Right side -->
            <div class="animation-panel">
                <canvas id="ionCanvas"></canvas>
            </div>

            <!-- Controls Panel - Left side -->
            <div class="controls-panel">
                <!-- Scale Selector (Top) -->
                <div class="control-section">
                    <label class="control-label">SCALE</label>
                    <div class="scale-selector"
                         data-help-title="SCALE"
                         data-help-description="Selects the scale/mode. Defines which notes are 'in key' and attract incoming MIDI notes.">
                        <button data-scale="major" class="active">MAJOR</button>
                        <button data-scale="minor">MINOR</button>
                        <button data-scale="dorian">DORIAN</button>
                        <button data-scale="phrygian">PHRYGIAN</button>
                        <button data-scale="lydian">LYDIAN</button>
                        <button data-scale="mixolydian">MIXO</button>
                        <button data-scale="aeolian">AEOLIAN</button>
                        <button data-scale="locrian">LOCRIAN</button>
                        <button data-scale="chromatic">CHROMATIC</button>
                    </div>
                </div>

                <!-- Root Selector -->
                <div class="control-section">
                    <label class="control-label">ROOT</label>
                    <div class="root-selector" id="rootSelector"
                         data-help-title="ROOT"
                         data-help-description="Root note of the scale/mode (C, C#, D, etc.). All notes are pulled toward this root.">
                        <button data-note="0" class="active">C</button>
                        <button data-note="1">C#</button>
                        <button data-note="2">D</button>
                        <button data-note="3">D#</button>
                        <button data-note="4">E</button>
                        <button data-note="5">F</button>
                        <button data-note="6">F#</button>
                        <button data-note="7">G</button>
                        <button data-note="8">G#</button>
                        <button data-note="9">A</button>
                        <button data-note="10">A#</button>
                        <button data-note="11">B</button>
                    </div>
                </div>

                <!-- Attraction Type -->
                <div class="control-section">
                    <label class="control-label">ATTRACTION</label>
                    <div class="attraction-type-selector"
                         data-help-title="ATTRACTION"
                         data-help-description="Mode selector - SNAP (immediate correction), PULL (gradual attraction), or GUIDE (subtle suggestion).">
                        <button data-type="snap" class="active">SNAP</button>
                        <button data-type="pull">PULL</button>
                        <button data-type="guide">GUIDE</button>
                    </div>
                </div>

                <!-- Attraction Strength Slider -->
                <div class="control-section">
                    <label class="control-label">ATTRACTION STRENGTH</label>
                    <div class="attraction-slider" id="attractionSlider" data-param="attraction"
                         data-help-title="TENSION"
                         data-help-description="Strength of the magnetic pull toward scale notes. Higher tension snaps notes more aggressively to the nearest in-key note.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="attractionStrengthValue">50%</div>
                </div>

                <!-- Field Strength Slider -->
                <div class="control-section">
                    <label class="control-label">FIELD STRENGTH</label>
                    <div class="field-strength-slider" id="fieldStrengthSlider" data-param="fieldStrength"
                         data-help-title="FIELD WIDTH"
                         data-help-description="Size of the harmonic attraction field. Wider fields allow more note deviation before correction.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="fieldStrengthValue">50%</div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">
                <span class="power-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2v10M18 6a9 9 0 1 1-12 0"/>
                    </svg>
                </span>
                <span class="bypass-text">ON</span>
            </button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="correctedNotes">Corrected: 0</span>
            </div>
        </footer>
    </div>

    <script src="orbitals-animations.js"></script>
    <script src="orbitals-particles.js"></script>
    <script src="orbitals-components.js"></script>
    
    <script src="app.js"></script>
    <script src="orbitals-juce-bridge.js"></script>
</body>
</html>
