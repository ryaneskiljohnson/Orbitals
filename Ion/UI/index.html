<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ion - Harmonic Constraint Engine</title>
    
    <link rel="stylesheet" href="../../_Shared/UI/orbitals-design-system.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container ion-theme">
        <header class="orbitals-header">
            <div class="orbitals-logo" title="NNAudio"></div>
            <h1>ION</h1>
            <div class="preset-browser">
                <span>Init Preset</span>
            </div>
        </header>

        <main class="plugin-main">
            <canvas id="ionCanvas"></canvas>

            <div class="controls-magnetic">
                <!-- Scale Selector (Top) -->
                <div class="control-magnetic-wide" style="grid-row: 1;">
                    <label class="control-label">SCALE</label>
                    <div class="scale-selector"
                         data-help-title="SCALE"
                         data-help-description="Selects the scale/mode. Defines which notes are 'in key' and attract incoming MIDI notes.">
                        <button data-scale="major" class="active">MAJOR</button>
                        <button data-scale="minor">MINOR</button>
                        <button data-scale="dorian">DORIAN</button>
                        <button data-scale="phrygian">PHRYGIAN</button>
                        <button data-scale="lydian">LYDIAN</button>
                        <button data-scale="mixolydian">MIXO</button>
                        <button data-scale="aeolian">AEOLIAN</button>
                        <button data-scale="locrian">LOCRIAN</button>
                        <button data-scale="chromatic">CHROMATIC</button>
                    </div>
                </div>

                <!-- Left: Key Center Selector -->
                <div class="control-magnetic-section" style="grid-column: 1; grid-row: 2;">
                    <label class="control-label">KEY CENTER</label>
                    <div class="key-center-selector" id="keyCenterSelector"
                         data-help-title="CENTER KEY"
                         data-help-description="Root note of the harmonic field (C, C#, D, etc.). All notes are pulled toward this key.">
                        <div class="chromatic-wheel"></div>
                    </div>
                    <div class="value-display" id="keyCenterValue">C</div>
                </div>

                <!-- Center: Field Strength Knob -->
                <div class="control-magnetic-center">
                    <label class="control-label">FIELD STRENGTH</label>
                    <div class="field-strength-knob" id="fieldStrengthKnob" data-param="fieldStrength"
                         data-help-title="FIELD WIDTH"
                         data-help-description="Size of the harmonic attraction field. Wider fields allow more note deviation before correction.">
                        <div class="knob-inner">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                    <div class="value-display large" id="fieldStrengthValue">50%</div>
                </div>

                <!-- Right: Attraction Type -->
                <div class="control-magnetic-section" style="grid-column: 3; grid-row: 2;">
                    <label class="control-label">ATTRACTION</label>
                    <div class="attraction-type-selector"
                         data-help-title="ATTRACTION"
                         data-help-description="Mode selector - SNAP (immediate correction), PULL (gradual attraction), or GUIDE (subtle suggestion).">
                        <button data-type="snap" class="active">SNAP</button>
                        <button data-type="pull">PULL</button>
                        <button data-type="guide">GUIDE</button>
                    </div>
                    <div class="value-display" id="attractionValue">SNAP</div>
                </div>

                <!-- Bottom: Attraction Strength Slider -->
                <div class="control-magnetic-wide" style="grid-row: 3;">
                    <label class="control-label">ATTRACTION STRENGTH</label>
                    <div class="attraction-slider" id="attractionSlider" data-param="attraction"
                         data-help-title="TENSION"
                         data-help-description="Strength of the magnetic pull toward scale notes. Higher tension snaps notes more aggressively to the nearest in-key note.">
                        <div class="slider-track"></div>
                        <div class="slider-handle"></div>
                    </div>
                    <div class="value-display" id="attractionStrengthValue">50%</div>
                </div>
            </div>
        </main>

        <footer class="orbitals-footer">
            <button class="bypass-toggle" id="bypassToggle"
                    data-help-title="BYPASS"
                    data-help-description="Disables all processing and passes MIDI through unaffected. Use to A/B compare or temporarily disable the effect.">BYPASS</button>
            <div class="info-display">
                <span id="noteCount">Notes: 0</span>
                <span id="correctedNotes">Corrected: 0</span>
            </div>
        </footer>
    </div>

    <script src="../../_Shared/UI/orbitals-animations.js"></script>
    <script src="../../_Shared/UI/orbitals-particles.js"></script>
    <script src="../../_Shared/UI/orbitals-components.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
